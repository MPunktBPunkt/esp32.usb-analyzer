; esp32.usb-analyzer — analyzer-node (Gate 1: USB Host enumeration)
;
; Toolchain: pioarduino Arduino-ESP32 3.2.1 (minimum for EspUsbHost 2.x).
; Serial console: UART / COM port — NOT the OTG USB port (shared PHY).
; Lab board default: YD-ESP32-S3 N8R2 (8 MiB flash + 2 MiB QSPI PSRAM).

[platformio]
default_envs = analyzer-s3-host
src_dir = src

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
; Click 8.5+ breaks the 5.0.0-dev1 esptool bundled with 54.03.21 — pin a fixed release.
platform_packages =
  tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.6.0/esptool.zip
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tanakamasayuki/EspUsbHost@2.10.1
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DFW_VERSION=\"0.0.38\"
  -DHUB_HOST=\"192.168.178.113\"
  -DHUB_PORT=8093
  -DCONTROLLER_HOST_DEFAULT=\"192.168.178.187\"
  -DCORE_DEBUG_LEVEL=1
  -I include
  -I src/esphub
  -I ../common/include
extra_scripts =
  pre:scripts/pack_ui_pre.py
  pre:scripts/gen_build_id.py

; Host role: OTG PHY owned by USB Host. Debug via UART (board COM port).
; Partition layout matches hu-probe 8 MiB so OTA from .88/.89 keeps NVS/WiFi.
[env:analyzer-s3-host]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_analyzer_8mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Do not compile Device TinyUSB MSC vendor patch on Host.
build_src_filter = +<*> -<tinyusb_patch/>
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  -DANALYZER_BOARD_S3=1
  -DANALYZER_ENABLE_USB_HOST=1
  -DANALYZER_ENABLE_USB_DEVICE=0
  -DANALYZER_DEFAULT_ROLE_HOST=1
  -DANALYZER_DEFAULT_ROLE_DEVICE=0
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

; Device / gadget role (Gate 2). Flash to .89 when COM available.
; OTG port faces PC/HU; Serial still on UART/COM.
; Gate-6: vendored msc_device.c (0.18.0) overrides prebuilt libarduino_tinyusb.a
; object of the same name when linked as a regular .o before the archive.
[env:analyzer-s3-device]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_analyzer_8mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_ignore = EspUsbHost
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  -DANALYZER_BOARD_S3=1
  -DANALYZER_ENABLE_USB_HOST=0
  -DANALYZER_ENABLE_USB_DEVICE=1
  -DANALYZER_MSC_CLASS_HOOK=1
  -DANALYZER_DEFAULT_ROLE_HOST=0
  -DANALYZER_DEFAULT_ROLE_DEVICE=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
