<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>usb-analyzer lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">usb-analyzer</div>
    <div class="meta" id="health">connecting…</div>
  </header>

  <main>
    <section class="lanes">
      <article class="lane" id="lane-host">
        <h2>HOST</h2>
        <p class="muted">L1 lab capture · <span class="mono" id="cap-meta-host">—</span></p>
        <div class="node-slot" data-role="host">kein Node</div>
        <div class="cap-list" id="cap-host"></div>
      </article>
      <article class="lane" id="lane-device">
        <h2>DEVICE</h2>
        <p class="muted">L1 lab capture · <span class="mono" id="cap-meta-device">—</span></p>
        <div class="node-slot" data-role="device">kein Node</div>
        <div class="cap-list" id="cap-device"></div>
      </article>
    </section>

    <section class="panel">
      <h2>Capture</h2>
      <p class="muted">timestamp_domain=<span class="mono">local_per_node</span> — clocks not synchronized · not D+/D− · click a row for inspector</p>
      <div class="actions" style="margin-bottom:0.5rem">
        <button type="button" id="btn-cap-pause">Pause</button>
        <button type="button" id="btn-cap-clear">Clear lanes</button>
      </div>
      <pre id="cap-inspect" class="inspect">select an event…</pre>
    </section>

    <section class="panel">
      <h2>Nodes</h2>
      <div id="nodes" class="nodes"></div>
    </section>

    <section class="panel">
      <h2>Live log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
